schema_version: 1

context:
  name: cuequivariance-torch
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/NVIDIA/cuEquivariance/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e59994643972d4f5578471fa53a3be810a4b756fc00a4b0542d09aac21a3c3d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install ./cuequivariance_torch -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - cuequivariance
    - pytorch

tests:
  - python:
      imports:
        - cuequivariance_torch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: CUDA accelerated equivariant operations
  license: Apache-2.0
  license_file: LICENSES/LICENSE
  homepage: https://github.com/NVIDIA/cuEquivariance

extra:
  recipe-maintainers:
    - fxcoudert
